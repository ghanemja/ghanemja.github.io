<!doctype html>
<html lang="en" data-medium="watercolor" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>janelle ghanem — projects</title>
<meta name="description" content="Everything I've built, in one searchable list. Or walk the 3D street version." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ghanemja/art-asset@v0.2.0/src/art-medium.css">
<script type="module" src="https://cdn.jsdelivr.net/gh/ghanemja/art-asset@v0.2.0/src/art-medium.js"></script>
<style>
  body { margin: 0; min-height: 100vh; padding: 48px 20px 80px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  header h1 { font-size: clamp(30px, 5vw, 44px); margin: 0 0 4px; }
  header p { margin: 0 0 22px; opacity: .8; }
  .top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .top .am-field { flex: 1; min-width: 240px; margin: 0; }
  .top .am-input input { width: 100%; font-size: 17px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-top: 22px; }
  .am-card h3 { margin: 0 0 2px; font-size: 20px; }
  .am-card .trade { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; margin: 0 0 8px; }
  .am-card p.desc { font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
  .am-card .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .am-card .links a { font-size: 14px; text-decoration: none; }
  #none { display: none; opacity: .7; margin-top: 26px; }
  footer { margin-top: 48px; font-size: 14px; opacity: .75; }
  footer a { color: inherit; }
</style>
</head>
<body class="am-canvas">
  <div class="wrap">
    <header>
      <h1>janelle ghanem</h1>
      <p>everything I've built, in one list — most are private previews, click through to sign in.</p>
      <div class="top">
        <label class="am-field">
          <span class="am-input"><input id="q" type="search" placeholder="search projects… (e.g. kanban, crochet, slides)" autofocus></span>
        </label>
        <a class="am-button" href="./">🏘 walk the street version</a>
      </div>
      <hr class="am-divider">
    </header>

    <div id="grid"></div>
    <p id="none" class="am-card">nothing matches that — try another word.</p>

    <footer>
      <a href="https://github.com/ghanemja">github.com/ghanemja</a> · <a href="mailto:janghanem@gmail.com">janghanem@gmail.com</a>
    </footer>
  </div>

<script type="module">
  import { PLACES } from './js/apps.js';

  const grid = document.getElementById('grid');
  const none = document.getElementById('none');
  const cards = PLACES.map(p => {
    const el = document.createElement('article');
    el.className = 'am-card';
    const live = p.url && !p.url.includes('github.com');
    el.innerHTML = `
      <h3>${p.title}</h3>
      <p class="trade">${p.trade}</p>
      <p class="desc">${p.desc}</p>
      <div class="links">
        ${live ? `<a class="am-button" href="${p.url}" target="_blank" rel="noopener">visit →</a>` : ''}
        <a class="am-button am--secondary" href="${p.repo}" target="_blank" rel="noopener">${live ? 'github' : 'github →'}</a>
      </div>`;
    el.dataset.hay = `${p.title} ${p.trade} ${p.desc} ${p.how} ${p.note || ''}`.toLowerCase();
    grid.appendChild(el);
    return el;
  });

  document.getElementById('q').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    for (const el of cards) {
      const hit = !q || q.split(/\s+/).every(w => el.dataset.hay.includes(w));
      el.style.display = hit ? '' : 'none';
      if (hit) shown++;
    }
    none.style.display = shown ? 'none' : 'block';
  });
</script>
</body>
</html>
